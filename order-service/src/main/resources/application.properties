server.port=${SERVER_PORT:8084}

spring.application.name=order-service
spring.config.import=optional:file:.env[.properties]
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27021/order_service_db}
spring.data.mongodb.auto-index-creation=true


eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

product-service.base-url=${PRODUCT_SERVICE_URL:http://product-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

orders-service.base-url=${ORDERS_SERVICE_URL:http://localhost:8084/orders}
