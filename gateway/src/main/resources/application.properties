spring.config.import=optional:file:./.env[.properties]

spring.application.name=gateway
server.port=${PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:gateway-keystore.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:gateway}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT
jwt.secret=${JWT_SECRET}

## user service routes
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=user-service-me
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/me/**

## product service routes
spring.cloud.gateway.server.webmvc.routes[2].id=product-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/products/**

## media service routes
spring.cloud.gateway.server.webmvc.routes[3].id=media-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://media-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/media/**

## order service routes
spring.cloud.gateway.server.webmvc.routes[4].id=order-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/orders/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always