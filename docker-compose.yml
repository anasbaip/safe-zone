services:
  # =========================================================
  # Product MongoDB
  # =========================================================
  product-mongodb:
    image: mongo:7
    container_name: product-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27019:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_DATABASE: "${PRODUCT_MONGO_DATABASE}"
      MONGO_USERNAME: "${PRODUCT_MONGO_USERNAME}"
      MONGO_PASSWORD: "${PRODUCT_MONGO_PASSWORD}"

    volumes:
      - product_mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    networks:
      - product-db-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================================
  # Media MongoDB
  # =========================================================
  media-mongodb:
    image: mongo:7
    container_name: media-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27020:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_DATABASE: "${MEDIA_MONGO_DATABASE}"
      MONGO_USERNAME: "${MEDIA_MONGO_USERNAME}"
      MONGO_PASSWORD: "${MEDIA_MONGO_PASSWORD}"

    volumes:
      - media_mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    networks:
      - media-db-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================================
  # User MongoDB
  # =========================================================
  user-mongodb:
    image: mongo:7
    container_name: user-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_DATABASE: "${USER_MONGO_DATABASE}"
      MONGO_USERNAME: "${USER_MONGO_USERNAME}"
      MONGO_PASSWORD: "${USER_MONGO_PASSWORD}"

    volumes:
      - user_mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    networks:
      - user-db-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================================
  # Order MongoDB
  # =========================================================
  order-mongodb:
    image: mongo:7
    container_name: order-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27021:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_DATABASE: "${ORDER_MONGO_DATABASE}"
      MONGO_USERNAME: "${ORDER_MONGO_USERNAME}"
      MONGO_PASSWORD: "${ORDER_MONGO_PASSWORD}"

    volumes:
      - order_mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    networks:
      - order-db-network

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "admin",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--eval",
          "db.runCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: buy01-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NODE_ID: "1"

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - buy01-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  # =========================================================
  # Discovery Service
  # =========================================================
  discovery:
    image: discovery:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-discovery
    restart: unless-stopped

    networks:
      - buy01-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # =========================================================
  # API Gateway
  # =========================================================
  gateway:
    image: gateway:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_PORT:-8444}:8080"

    volumes:
      - /var/jenkins_home/deploy-secrets/buy01/certs/gateway-keystore.p12:/run/secrets/gateway-keystore.p12:ro

    environment:
      SERVER_PORT: "8080"

      SERVER_SSL_ENABLED: "true"

      SERVER_SSL_KEY_STORE: "file:/run/secrets/gateway-keystore.p12"

      SERVER_SSL_KEY_STORE_PASSWORD: "${SERVER_SSL_KEY_STORE_PASSWORD}"

      SERVER_SSL_KEY_STORE_TYPE: "PKCS12"

      SERVER_SSL_KEY_ALIAS: "gateway"

      EUREKA_CLIENT_SERVICE_URL: "http://discovery:8761/eureka/"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"

      JWT_SECRET: "${JWT_SECRET}"

    depends_on:
      discovery:
        condition: service_healthy

    networks:
      - buy01-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # =========================================================
  # User Service
  # =========================================================
  user-service:
    image: user-service:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-user-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8081"

      EUREKA_CLIENT_SERVICE_URL: "http://discovery:8761/eureka/"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"

      MONGODB_URI: "mongodb://${USER_MONGO_USERNAME}:${USER_MONGO_PASSWORD}@user-mongodb:27017/${USER_MONGO_DATABASE}?authSource=${USER_MONGO_DATABASE}"

      SPRING_MONGODB_URI: "mongodb://${USER_MONGO_USERNAME}:${USER_MONGO_PASSWORD}@user-mongodb:27017/${USER_MONGO_DATABASE}?authSource=${USER_MONGO_DATABASE}"

      SPRING_DATA_MONGODB_URI: "mongodb://${USER_MONGO_USERNAME}:${USER_MONGO_PASSWORD}@user-mongodb:27017/${USER_MONGO_DATABASE}?authSource=${USER_MONGO_DATABASE}"

      JWT_SECRET: "${JWT_SECRET}"

      JWT_EXPIRATION: "${JWT_EXPIRATION}"

    depends_on:
      discovery:
        condition: service_healthy

      user-mongodb:
        condition: service_healthy

    networks:
      - buy01-network
      - user-db-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # =========================================================
  # Product Service
  # =========================================================
  product-service:
    image: product-service:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-product-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8082"

      EUREKA_CLIENT_SERVICE_URL: "http://discovery:8761/eureka/"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"

      MONGODB_URI: "mongodb://${PRODUCT_MONGO_USERNAME}:${PRODUCT_MONGO_PASSWORD}@product-mongodb:27017/${PRODUCT_MONGO_DATABASE}?authSource=${PRODUCT_MONGO_DATABASE}"

      SPRING_MONGODB_URI: "mongodb://${PRODUCT_MONGO_USERNAME}:${PRODUCT_MONGO_PASSWORD}@product-mongodb:27017/${PRODUCT_MONGO_DATABASE}?authSource=${PRODUCT_MONGO_DATABASE}"

      SPRING_DATA_MONGODB_URI: "mongodb://${PRODUCT_MONGO_USERNAME}:${PRODUCT_MONGO_PASSWORD}@product-mongodb:27017/${PRODUCT_MONGO_DATABASE}?authSource=${PRODUCT_MONGO_DATABASE}"

      MEDIA_SERVICE_URL: "http://media-service:8083/media/images"

      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    depends_on:
      discovery:
        condition: service_healthy

      product-mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

    networks:
      - buy01-network
      - product-db-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # =========================================================
  # Media Service
  # =========================================================
  media-service:
    image: media-service:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-media-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8083"

      EUREKA_CLIENT_SERVICE_URL: "http://discovery:8761/eureka/"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"

      MONGODB_URI: "mongodb://${MEDIA_MONGO_USERNAME}:${MEDIA_MONGO_PASSWORD}@media-mongodb:27017/${MEDIA_MONGO_DATABASE}?authSource=${MEDIA_MONGO_DATABASE}"

      SPRING_MONGODB_URI: "mongodb://${MEDIA_MONGO_USERNAME}:${MEDIA_MONGO_PASSWORD}@media-mongodb:27017/${MEDIA_MONGO_DATABASE}?authSource=${MEDIA_MONGO_DATABASE}"

      SPRING_DATA_MONGODB_URI: "mongodb://${MEDIA_MONGO_USERNAME}:${MEDIA_MONGO_PASSWORD}@media-mongodb:27017/${MEDIA_MONGO_DATABASE}?authSource=${MEDIA_MONGO_DATABASE}"

      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"

      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"

      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"

      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    depends_on:
      discovery:
        condition: service_healthy

      media-mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

    networks:
      - buy01-network
      - media-db-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # =========================================================
  # Order Service
  # =========================================================
  order-service:
    image: order-service:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-order-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8084"

      EUREKA_CLIENT_SERVICE_URL: "http://discovery:8761/eureka/"

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery:8761/eureka/"

      MONGODB_URI: "mongodb://${ORDER_MONGO_USERNAME}:${ORDER_MONGO_PASSWORD}@order-mongodb:27017/${ORDER_MONGO_DATABASE}?authSource=${ORDER_MONGO_DATABASE}"

      SPRING_MONGODB_URI: "mongodb://${ORDER_MONGO_USERNAME}:${ORDER_MONGO_PASSWORD}@order-mongodb:27017/${ORDER_MONGO_DATABASE}?authSource=${ORDER_MONGO_DATABASE}"

      SPRING_DATA_MONGODB_URI: "mongodb://${ORDER_MONGO_USERNAME}:${ORDER_MONGO_PASSWORD}@order-mongodb:27017/${ORDER_MONGO_DATABASE}?authSource=${ORDER_MONGO_DATABASE}"

    depends_on:
      discovery:
        condition: service_healthy

      order-mongodb:
        condition: service_healthy

    networks:
      - buy01-network
      - order-db-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # =========================================================
  # Frontend
  # =========================================================
  frontend:
    image: frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: buy01-frontend
    restart: unless-stopped

    ports:
      - "4200:443"

    volumes:
      - /var/jenkins_home/deploy-secrets/buy01/certs/gateway-keystore.crt:/etc/nginx/certs/gateway-keystore.crt:ro
      - /var/jenkins_home/deploy-secrets/buy01/certs/gateway-keystore.key:/etc/nginx/certs/gateway-keystore.key:ro

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - buy01-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:443/index.html || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


# =========================================================
# Persistent Volumes
# =========================================================
volumes:

  product_mongo_data:

  media_mongo_data:

  user_mongo_data:

  order_mongo_data:


# =========================================================
# Docker Networks
# =========================================================
networks:

  buy01-network:
    driver: bridge

  product-db-network:
    driver: bridge

  media-db-network:
    driver: bridge

  user-db-network:
    driver: bridge

  order-db-network:
    driver: bridge
