# Secret values are exported by docker-entrypoint.sh before JCasC starts.
# The plain-credentials plugin supplies the file/secretBytes credential schema.
jenkins:
    systemMessage: |
        Buy01 Jenkins

        This Jenkins controller is configured automatically
        using Jenkins Configuration as Code (JCasC).

    # BEGIN SONAR PROJECT KEYS
    globalNodeProperties:
        - envVars:
            env:
                - key: SONAR_PRODUCT_PROJECT_KEY
                  value: "${SONAR_PRODUCT_PROJECT_KEY}"
                - key: SONAR_USER_PROJECT_KEY
                  value: "${SONAR_USER_PROJECT_KEY}"
                - key: SONAR_MEDIA_PROJECT_KEY
                  value: "${SONAR_MEDIA_PROJECT_KEY}"
                - key: SONAR_ORDER_PROJECT_KEY
                  value: "${SONAR_ORDER_PROJECT_KEY}"
                - key: SONAR_GATEWAY_PROJECT_KEY
                  value: "${SONAR_GATEWAY_PROJECT_KEY}"
                - key: SONAR_DISCOVERY_PROJECT_KEY
                  value: "${SONAR_DISCOVERY_PROJECT_KEY}"
                - key: SONAR_FRONTEND_PROJECT_KEY
                  value: "${SONAR_FRONTEND_PROJECT_KEY}"
    # END SONAR PROJECT KEYS

    numExecutors: 1

    mode: NORMAL

    scmCheckoutRetryCount: 2

    # ==========================================
    # Jenkins Authentication
    # ==========================================

    securityRealm:
        local:
            allowsSignup: false

            users:
                - id: "admin"
                  password: "${JENKINS_ADMIN_PASSWORD}"

    # ==========================================
    # Authorization
    # ==========================================

    authorizationStrategy:
        loggedInUsersCanDoAnything:
            allowAnonymousRead: true

    crumbIssuer:
        standard: {}

# ==========================================
# Jenkins Credentials
# ==========================================

credentials:
    system:
        domainCredentials:
            - credentials:
                  # BEGIN SONAR CREDENTIALS
                  # ==================================
                  # SonarQube - Product Service
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-product-token"
                        description: "SonarQube Product Service token"
                        secret: "${SONAR_PRODUCT_TOKEN}"

                  # ==================================
                  # SonarQube - User Service
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-user-token"
                        description: "SonarQube User Service token"
                        secret: "${SONAR_USER_TOKEN}"

                  # ==================================
                  # SonarQube - Media Service
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-media-token"
                        description: "SonarQube Media Service token"
                        secret: "${SONAR_MEDIA_TOKEN}"

                  # ==================================
                  # SonarQube - API Gateway
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-gateway-token"
                        description: "SonarQube Gateway token"
                        secret: "${SONAR_GATEWAY_TOKEN}"

                  # ==================================
                  # SonarQube - Discovery Service
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-discovery-token"
                        description: "SonarQube Discovery Service token"
                        secret: "${SONAR_DISCOVERY_TOKEN}"

                  # ==================================
                  # SonarQube - Frontend
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-frontend-token"
                        description: "SonarQube Frontend token"
                        secret: "${SONAR_FRONTEND_TOKEN}"

                  # ==================================
                  # SonarQube - Order Service (includes Cart and Checkout)
                  # ==================================
                  - string:
                        scope: GLOBAL
                        id: "sonar-order-token"
                        description: "SonarQube Order Service token"
                        secret: "${SONAR_ORDER_TOKEN}"

                  # END SONAR CREDENTIALS
                  # ==================================
                  # GitHub
                  # ==================================

                  - usernamePassword:
                        scope: GLOBAL

                        id: "github-mr-jenk"

                        description: "GitHub credentials for mr-jenk"

                        username: "${GITHUB_USERNAME}"

                        password: "${GITHUB_PAT}"

                  # ==================================
                  # Buy01 .env
                  # ==================================

                  - file:
                        scope: GLOBAL

                        id: "buy01-env"

                        description: "Buy01 application environment"

                        fileName: ".env"

                        secretBytes: "${BUY01_ENV_B64}"

                  # ==================================
                  # Gateway PKCS12
                  # ==================================

                  - file:
                        scope: GLOBAL

                        id: "gateway-p12"

                        description: "Gateway PKCS12 keystore"

                        fileName: "gateway-keystore.p12"

                        secretBytes: "${GATEWAY_P12_B64}"

                  # ==================================
                  # Gateway certificate
                  # ==================================

                  - file:
                        scope: GLOBAL

                        id: "gateway-crt"

                        description: "Gateway public certificate"

                        fileName: "gateway-keystore.crt"

                        secretBytes: "${GATEWAY_CRT_B64}"

                  # ==================================
                  # Gateway private key
                  # ==================================

                  - file:
                        scope: GLOBAL

                        id: "gateway-key"

                        description: "Gateway private key"

                        fileName: "gateway-keystore.key"

                        secretBytes: "${GATEWAY_KEY_B64}"

# ==========================================
# Jenkins Job
# ==========================================

jobs:
    - script: |

          pipelineJob('first-pipeline') {

              description('Buy01 CI/CD Pipeline - managed by JCasC')

              triggers {
                  githubPush()
                  cron('H H(1-4) * * *')
              }

              definition {

                  cpsScm {

                      scm {

                          git {

                              remote {

                                  url('https://github.com/AyyoubMh48/buy-02')

                                  credentials('github-mr-jenk')

                                 }

                              branch('*/main')

                          }

                      }

                      scriptPath('Jenkinsfile')

                      lightweight()

                  }

              }

            }

# BEGIN SONAR SERVER
# sonar:2.19.0 SonarGlobalConfiguration / SonarInstallation data-bound fields.
unclassified:
    sonarglobalconfiguration:
        buildWrapperEnabled: true
        installations:
            - name: "SonarQube"
              serverUrl: "http://sonarqube:9000"
              credentialsId: "sonar-product-token"
